<h1>Petrify</h1>
<p class="kind">Obsidian 플러그인</p>

<p>손글씨 노트 파일을 Obsidian 안에서 Excalidraw나 Markdown으로 바꾸는 플러그인이에요. OCR로 손글씨를 검색할 수 있게 해요. Viwoods와 Supernote X 시리즈의 <code>.note</code> 파일, 그리고 PDF를 지원해요.</p>
